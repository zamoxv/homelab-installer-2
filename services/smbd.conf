# Samba: recurso nativo del host (no vive en contenedor). SERVICE_DATA es la
# propia configuración de Samba (no $BACKUP_ROOT: eso es el DESTINO de los
# backups, no un dato de ESTE servicio — cada registro describe sus propios
# datos, no ajenos).
SERVICE_NAME="Samba"
SERVICE_KIND="native"
SERVICE_UNIT="smbd"
SERVICE_PORT=""
SERVICE_URL_SCHEME="smb"
SERVICE_DATA=("/etc/samba/smb.conf")
SERVICE_BACKUP_KIND="files"
