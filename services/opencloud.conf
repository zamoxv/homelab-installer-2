# OpenCloud: planeado para v2.3. Público vía Cloudflare Tunnel (v2.4), sin
# puerto directo del host.
SERVICE_NAME="OpenCloud"
SERVICE_KIND="container"
SERVICE_CONTAINER="opencloud"
SERVICE_PORT=""
SERVICE_URL_SCHEME=""
SERVICE_DATA=("$APPDATA_ROOT/opencloud/config" "$APPDATA_ROOT/opencloud/data")
SERVICE_BACKUP_KIND="files"
# Los archivos de OpenCloud ya viven en los clientes que sincronizan: solo van a
# la copia local, no a R2.
SERVICE_BACKUP_LOCAL_ONLY=("$APPDATA_ROOT/opencloud/data")
