# Home Assistant: planeado para v2.3. Modo Container en red del host (mDNS/SSDP).
SERVICE_NAME="Home Assistant"
SERVICE_KIND="container"
SERVICE_CONTAINER="homeassistant"
SERVICE_PORT="8123"
SERVICE_URL_SCHEME="http"
SERVICE_DATA=("$APPDATA_ROOT/homeassistant/config")
# Base de datos SQLite (home-assistant_v2.db): el backup lo detiene un momento.
SERVICE_BACKUP_KIND="sqlite"
