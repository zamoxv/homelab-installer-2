# Ollama (v2.6c): IA local en CPU, desplegada vía la API de Dokploy con el
# compose de compose/ollama/docker-compose.yml ('container_name: ollama'
# explícito). Sin puerto: no se publica en el host, solo es alcanzable desde
# Hermes por la red compartida.
SERVICE_NAME="Ollama (IA local)"
SERVICE_KIND="container"
SERVICE_CONTAINER="ollama"
SERVICE_PORT=""
SERVICE_URL_SCHEME=""
# Sin SERVICE_DATA a propósito: los modelos pesan varios GB y se vuelven a
# descargar con 'ollama pull', así que NUNCA entran en los backups (ni local ni
# R2). Declarar la carpeta como dato (aun excluida) haría que "restaurar todo"
# detuviera y reiniciara el contenedor sin restaurar nada (probado con
# tests/test_restore.sh). Mismo criterio que cloudflared.
SERVICE_DATA=()
SERVICE_BACKUP_KIND="none"
