# Tailscale (v2.4a): VPN privada instalada nativa en el host desde el
# repositorio oficial de Tailscale. Sin puerto ni URL propios; su estado es el
# de la unidad systemd 'tailscaled'. El estado de la sesión (clave de nodo)
# vive en /var/lib/tailscale y se vuelve a crear con 'tailscale up'.
SERVICE_NAME="Tailscale"
SERVICE_KIND="native"
SERVICE_UNIT="tailscaled"
SERVICE_PORT=""
SERVICE_URL_SCHEME=""
SERVICE_DATA=()
SERVICE_BACKUP_KIND="none"
