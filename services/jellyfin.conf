# Jellyfin: planeado para v2.2. Hasta entonces el dashboard lo muestra como
# "no instalado" (no hay contenedor "jellyfin" corriendo).
SERVICE_NAME="Jellyfin"
SERVICE_KIND="container"
SERVICE_CONTAINER="jellyfin"
SERVICE_PORT="8096"
SERVICE_URL_SCHEME="http"
SERVICE_DATA=("$APPDATA_ROOT/jellyfin/config" "$APPDATA_ROOT/jellyfin/cache")
SERVICE_BACKUP_KIND="sqlite"
