# Jellyfin (v2.2): desplegado vía la API de Dokploy (lib/dokploy_api.sh) con
# el compose de compose/jellyfin/docker-compose.yml, que fija
# 'container_name: jellyfin' explícito (no se depende del nombre que Dokploy
# le pondría por defecto al servicio de compose) — así SERVICE_CONTAINER
# coincide siempre con el contenedor real y service_state() funciona.
SERVICE_NAME="Jellyfin"
SERVICE_KIND="container"
SERVICE_CONTAINER="jellyfin"
SERVICE_PORT="8096"
SERVICE_URL_SCHEME="http"
SERVICE_DATA=("$APPDATA_ROOT/jellyfin/config" "$APPDATA_ROOT/jellyfin/cache")
SERVICE_BACKUP_KIND="sqlite"
# La caché se regenera sola: nunca entra en los backups.
SERVICE_BACKUP_EXCLUDE=("$APPDATA_ROOT/jellyfin/cache")
