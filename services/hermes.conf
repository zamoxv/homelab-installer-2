# Hermes Agent (v2.6a): agente 24/7 desplegado vía la API de Dokploy con el
# compose de compose/hermes/docker-compose.yml ('container_name: hermes'
# explícito). Los puertos 8642 (API) y 9119 (dashboard) se publican SOLO en
# la IP de la LAN y la de Tailscale; SERVICE_PORT apunta al dashboard para el
# enlace de service_url().
SERVICE_NAME="Hermes Agent"
SERVICE_KIND="container"
SERVICE_CONTAINER="hermes"
SERVICE_PORT="9119"
SERVICE_URL_SCHEME="http"
SERVICE_DATA=("$APPDATA_ROOT/hermes")
# state.db es SQLite (modo WAL): el backup detiene el contenedor durante la
# foto local. Dentro de /opt/data solo se documenta como regenerable
# 'cache/' (se autolimpia a las 72 h); no se excluye porque las exclusiones
# deben ser rutas de SERVICE_DATA y su peso es marginal.
SERVICE_BACKUP_KIND="sqlite"
