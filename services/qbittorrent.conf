# qBittorrent (v2.2): desplegado vía la API de Dokploy con el compose de
# compose/qbittorrent/docker-compose.yml ('container_name: qbittorrent'
# explícito; ver services/jellyfin.conf para el motivo).
SERVICE_NAME="qBittorrent"
SERVICE_KIND="container"
SERVICE_CONTAINER="qbittorrent"
SERVICE_PORT="8080"
SERVICE_URL_SCHEME="http"
SERVICE_DATA=("$APPDATA_ROOT/qbittorrent/config")
SERVICE_BACKUP_KIND="files"
