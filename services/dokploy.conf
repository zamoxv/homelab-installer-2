# Dokploy: instalado por el módulo "dokploy" (v2.1). Corre como SERVICIO de
# Docker Swarm, no como contenedor suelto: el contenedor real se llama
# "dokploy.1.<id>" (nombre generado por swarm, cambia en cada redeploy), por
# eso SERVICE_KIND=swarm en vez de "container" — service_state lo resuelve
# con 'docker service ls' (da las réplicas listas, ej. "1/1"), nunca con
# 'docker inspect <nombre>'. Panel en 3000. Sus propios datos los administra
# Dokploy (no van en /srv/appdata) y sus backups van solo a S3 (Dokploy), no
# a la capa local de HLI 2.
SERVICE_NAME="Dokploy"
SERVICE_KIND="swarm"
SERVICE_CONTAINER="dokploy"
SERVICE_PORT="3000"
SERVICE_URL_SCHEME="http"
SERVICE_DATA=()
SERVICE_BACKUP_KIND="none"
