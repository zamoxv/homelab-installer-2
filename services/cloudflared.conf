# Cloudflare Tunnel (v2.4a): conector saliente hacia Cloudflare, desplegado
# vía la API de Dokploy (compose/cloudflared/docker-compose.yml). Sin puerto:
# no expone nada en el host. Sin datos persistentes: el token vive en
# /etc/hli2/cloudflared.env (root-only, lib/secrets.sh) y las rutas en el
# panel de Cloudflare.
SERVICE_NAME="Cloudflare Tunnel"
SERVICE_KIND="container"
SERVICE_CONTAINER="cloudflared"
SERVICE_PORT=""
SERVICE_URL_SCHEME=""
SERVICE_DATA=()
SERVICE_BACKUP_KIND="none"
