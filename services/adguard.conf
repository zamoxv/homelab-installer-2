# AdGuard Home (v2.2): panel en 3053 (el 3000 es de Dokploy). Desplegado vía
# la API de Dokploy con el compose de compose/adguard/docker-compose.yml
# ('container_name: adguard' explícito; ver services/jellyfin.conf para el
# motivo). network_mode: host, así que SERVICE_PORT es informativo para
# service_url()/dashboard, no un puerto publicado por Docker.
SERVICE_NAME="AdGuard Home"
SERVICE_KIND="container"
SERVICE_CONTAINER="adguard"
SERVICE_PORT="3053"
SERVICE_URL_SCHEME="http"
SERVICE_DATA=("$APPDATA_ROOT/adguard/conf" "$APPDATA_ROOT/adguard/work")
# Base embebida bbolt (work/data): el backup lo detiene un momento.
SERVICE_BACKUP_KIND="sqlite"
