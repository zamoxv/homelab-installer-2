# Plantilla renderizada por lib/compose.sh (compose_render_hermes).
# Hermes Agent (Nous Research), base de v2.6a. Partiendo de la plantilla
# oficial de Dokploy (dokploy.com/templates/hermes, verificada 2026-10-16) y
# de la guía de Docker (hermes-agent.nousresearch.com/docs/user-guide/docker):
# imagen nousresearch/hermes-agent, 'command: gateway run', datos en
# /opt/data, API compatible con OpenAI en 8642 y dashboard en 9119.
#
# Imagen FIJADA a v0.22.2 (publicada el 2026-10-15; etiquetas 'latest' y
# 'stable' apuntan a la misma, la guía las describe como "stable release
# gate") Y por digest: sha256:3609... es el digest de la lista de manifiestos
# (amd64 + arm64) de esa etiqueta según la API de Docker Hub, verificado el
# 2026-10-16. Nunca ':latest': una actualización silenciosa podría cambiar el
# comportamiento del agente con acceso a terminal. Para actualizar se cambian
# etiqueta y digest juntos y se vuelve a correr el módulo.
#
# Secretos: SOLO referencias "${VAR}" (sustitución de Dokploy vía su campo
# "env", ver dokploy_compose_create_or_update en lib/dokploy_api.sh y
# modules/hermes.sh). Ningún valor real vive en este archivo versionado.
#
# Aislamiento (decisión de v2.6a): sin docker.sock (el backend de terminal
# 'docker' equivale a root en el host), sin montar /srv ni el home (solo
# el directorio de datos y, desde v2.6d, el informe del servidor en solo
# lectura), sin red del host. La imagen arranca con s6-overlay
# como root y baja a HERMES_UID/HERMES_GID para el agente y todos sus
# servicios (la guía: 'gateway run' como root se rechaza por defecto);
# no se fuerza 'user:' porque el entrypoint necesita ese arranque para
# ajustar permisos de /opt/data.
#
# Endurecimiento: 'no-new-privileges' y el límite de procesos son compatibles con el
# arranque de la imagen: el entrypoint (s6-overlay) corre como root y baja al
# uid del agente con s6-setuidgid, es decir con llamadas setuid/setgid, no
# ejecutando binarios setuid (docker/main-wrapper.sh y stage2-hook.sh del
# repositorio, v0.22.2); la imagen documenta además que no trae sudo. Si en
# el servidor el contenedor no arranca, ver el plan de contingencia en
# docs/VALIDACION.md (prueba 119).
#
# Red propia con subred fija (aislamiento de salida): el módulo instala
# reglas de iptables (cadenas HLI2-HERMES-*, ver modules/hermes.sh) que le
# impiden al agente iniciar conexiones hacia la LAN, Tailscale, la propia
# máquina y otras redes privadas; Internet queda abierta. dns: servidores que
# usa el contenedor (el DNS de la LAN solo si AdGuard está instalado).
#
# Puertos: SOLO en IPs concretas del host (la de la LAN y, si Tailscale
# está activo, la de Tailscale), nunca en 0.0.0.0. compose_render_hermes
# arma las líneas de puertos (un par 8642/9119 por IP). Sin dominio ni
# ruta del túnel. Dentro del contenedor la API escucha en 0.0.0.0
# (API_SERVER_HOST), porque Docker publica hacia la interfaz del contenedor.
#
# Compose "docker-compose" (no "stack"): las publicaciones con IP del host
# no se comportan igual en Swarm (mismo motivo que compose/adguard).
services:
  hermes:
    image: nousresearch/hermes-agent:v0.22.2@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    shm_size: 1g
    security_opt:
      - no-new-privileges:true
    networks:
      - hermes-net
    dns:
__DNS_LINES__
    ports:
__PORT_LINES__
    environment:
      - HERMES_UID=__UID__
      - HERMES_GID=__GID__
      # Hora local para recordatorios/cron: Hermes lee HERMES_TIMEZONE, luego
      # 'timezone:' de config.yaml y, si no hay ninguno, la hora del proceso
      # (UTC en el contenedor); 'TZ' solo no lo lee Hermes (hermes_time.py,
      # v0.22.2). Lo fija el módulo con la zona del servidor.
      - HERMES_TIMEZONE=__TIMEZONE__
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${API_SERVER_KEY}
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
__TELEGRAM_ENV__
    volumes:
      - __APPDATA__/hermes:/opt/data
      # Informe de diagnóstico del servidor (v2.6d): carpeta de root fuera del
      # árbol del usuario (REPORT_DIR, lib/report.sh); lo escribe root cada 5
      # minutos (hli2-report.timer), filtrado y sin secretos. SOLO LECTURA: el
      # agente nunca recibe escritura sobre él ni acceso a nada más del host.
      - __REPORT_DIR__:/opt/host-report:ro
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
          # Límite de procesos aquí y no como 'pids_limit' de servicio: con un
          # bloque deploy.resources.limits presente, Docker Compose v2 rechaza
          # el proyecto si ambos valores difieren ("can't set distinct values on
          # 'pids_limit' and 'deploy.resources.limits.pids'", visto en el M70q).
          pids: 512

networks:
  hermes-net:
    driver: bridge
    ipam:
      config:
        - subnet: __SUBNET__
