# Configuración de HLI 2
# Este archivo se lee al iniciar (lib/core.sh). Los valores vacíos toman un
# valor por defecto razonable; el instalador pregunta lo que necesite en el
# momento (nunca asume en silencio).

SERVER_USER=""

# Grupo Unix dueño de los datos de media/appdata.
MEDIA_GROUP="media"

# Raíz del pool de media. Cada disco adicional que se suma con el módulo
# "datadisk" aparece como /srv/media2, /srv/media3, etc.
MEDIA_ROOT="/srv/media"

# Datos persistentes de los servicios en contenedor (Jellyfin, qBittorrent,
# AdGuard, Vaultwarden, Home Assistant, OpenCloud, Dokploy...).
APPDATA_ROOT="/srv/appdata"

# Repositorio restic de la copia local (carpeta oculta, root 0700). Debe estar
# en un disco distinto al del sistema: el backup se niega a correr si no.
BACKUP_ROOT="$MEDIA_ROOT/.hli2-backups"

# Interfaz de red para Wake-on-LAN. Vacío = autodetectar.
NETWORK_IFACE=""

# Subcarpetas estándar dentro de cada raíz de media.
MEDIA_FOLDERS=(peliculas series musica libros fotos videos downloads transcode)
